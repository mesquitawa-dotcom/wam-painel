<title>Painel do dia — 10/09/2026 (v25)</title>
<!--
  v25 (09/09/2026) — fechamento apos LACUNA de 02 a 08/09 (R22). SOMENTE CONTEUDO:
  datas da regua e do tempo, prazos estourados dos 16 itens da janela, itens novos
  #100 (sessao de consolidacao) e #101 (evento da parcela da Dra. Elaine), interfaces
  do Inventario e da Fabrica, prioridades-base do dia. Tres rotulos de data que estavam
  presos em 31/08 foram corrigidos (placar, relato do dia, rotulo do balde "vencem hoje")
  — defeito de conteudo declarado, nao mudanca visual. Nenhuma linha de CSS alterada:
  bloco de estilo conferido identico byte a byte (MD5) contra a base. Base: v24 recuperado
  do repositorio por raw.githubusercontent.com (R29 item 3).

  v24 (01/09/2026) — fechamento DUPLO (31/08 nao realizado + 01/09). SOMENTE CONTEUDO:
  nenhuma linha de CSS, layout, mecanica, chave de memoria ou formato de relato foi tocada
  (R29 itens 2 e 4; bloco de estilo conferido identico byte a byte contra a base). Base:
  v23 recuperado do repositorio por raw.githubusercontent.com (R29 item 3).
  Entram: #61 com objeto reescrito (autos LIDOS, R$ 8.366,94, so IPTU 2020-2021, risco de
  SISBAJUD), #36 ENCERRADA por decisao datada (manter o patrocinio), #47 cumprida em parte
  com novo objeto (confirmar o envio da complementar), #34 recomposta, quatro pendencias
  novas (#96 parecer com a Dra. Elaine, #97 SIAT Campo Grande, #98 evento de 15/09,
  #99 "parcela Dr. Luiz"), o fallback da CND em 02/09 as 09h00 e a cobranca da Dra. Bruna
  em 03/09. Saem os itens vencidos por fato: AGENDA (conflito das 17h30) e #36.

  v23 (30/08/2026) — bloco de interface do Inventario atualizado (versao mais completa
  do mesmo dia). SOMENTE CONTEUDO: nenhuma linha de CSS, layout, mecanica, chave de
  memoria ou formato de relato foi tocada (R29 itens 2 e 4; bloco de estilo conferido
  identico byte a byte contra a base). Base: v22 recuperado do repositorio por
  raw.githubusercontent.com, hash conferido contra o arquivo publicado (R29 item 3).
  Entram tres fatos novos: a Prefeitura condiciona o pagamento a certidao do locador —
  a CND vencida deixou de ser so papel e passou a BLOQUEAR RECEITA do espolio; a
  quitacao federal de R$ 45.861,18 e pre-requisito da rota do precatorio; e a
  elegibilidade do ITCD ao Refis III nao esta confirmada.

  v22 (30/08/2026) — SEXTO fechamento do domingo. SOMENTE CONTEUDO: nenhuma linha de
  CSS, layout, mecanica, chave de memoria ou formato de relato foi tocada (R29 itens 2 e 4;
  bloco de estilo conferido identico byte a byte contra a base). Base: v21 recuperado do
  repositorio por raw.githubusercontent.com — nao de leitura de tela (R29 item 3).
  Entram: tres pendencias novas (#93 escritorio do Dr. Luiz/imobiliaria, #94 venda da
  maquina de cafe, #95 rotina diaria de contas a pagar), a terceira pergunta da #55
  (Refis III/MT), o marco de 29/12 na regua, a atualizacao da interface do Inventario
  (ITCD e Refis III na mesma cobranca ao Juverlan) e o marco de 15/09 da massa congelada
  na aba Fabrica, declarado SEM GATILHO.

  v21 (30/08/2026) — BUSCA POR TERMO, pedida expressamente por Wagner (aval da R29,
  que exige aval para mudanca visual). Base: v20 recuperado do repositorio por SHA,
  nao reconstruido de leitura de tela. Um campo abaixo do cabecalho procura o termo
  em todo o conteudo do painel: itens (titulo, detalhe, prazo, proximo passo, selo,
  vinculo, por que/destrava e a NOTA digitada no dia), lista "Por resolver" com sua
  triagem, frentes do mapa e o texto de interface, regua de datas e nota livre.
  Acento e maiuscula nao contam. Clicar no resultado troca de aba/tela e rola ate o
  item, abrindo grupo e detalhes recolhidos. Nenhuma mecanica, contagem, marcacao,
  chave de memoria ou formato de relato foi tocada — a busca so le.
  Corrigido junto, defeito de metadado: o subtitulo apontava o mestre de 30/08 (v4);
  o vigente e o v5.

  v20 (30/08/2026) — conteudo do quarto fechamento sobre a base visual do v19, intacta.
  Duas mudanças, as duas de conteúdo derivado do mestre, nenhuma de desenho:
  (a) DEFEITO DE METADADO corrigido — o cabeçalho apontava o mestre de 28/08 (v4);
      o vigente é o de 30/08 (v1);
  (b) a interface do Inventário de 30/08 entrou: CND estadual VENCIDA, ligação para
      a Sicredi na manhã de 31/08, e o CONFLITO DE AGENDA das 17h30.
  O congelamento segue contando do v18: isto é defeito + conteúdo, não escopo novo.

  v18 (29/08/2026) — CORREÇÃO DE DEFEITO da própria publicação, apurada com dois prints
  em que Wagner via o v16 depois do v17 já estar no ar. O navegador guardava a página
  em cache e servia a versão antiga: exatamente o risco que a decisão de 22/08 nomeou —
  "tela fixa mostra dado velho com cara de atual". Dois consertos: cabeçalhos que
  impedem o cache, e um carimbo de versão visível no alto, para dar para conferir de
  olho se a tela é a do dia. Nada além disso mudou.

  v17 (29/08/2026) — CORREÇÃO DE DEFEITO sobre o v16, apurada com print de Wagner.
  O v16 condicionava a mecânica de telas a "largura < 900px". O navegador do celular
  de Wagner opera com viewport largo, então caía no desenho de duas colunas do
  desktop: coluna esquerda espremida, tudo junto, telanav invisível. A DETECÇÃO de
  aparelho era o defeito. Conserto: a detecção foi removida. A mecânica de telas
  (Visão como porta · Executar · Triagem, barra fixa embaixo) vale em qualquer
  largura; o desenho de duas colunas do desktop foi removido; o enxuto é o padrão
  universal, com ⤢ devolvendo régua e subtítulo. Em tela larga: coluna única centrada.
  Mecânica, contagens, marcações e formato do relato: intocados.

  v16 (29/08/2026) — MUDANÇA DE ESCOPO no celular, pedida expressamente por Wagner e
  adotada por decisão datada. NÃO é correção de defeito: retifica, quanto a este ponto,
  o congelamento decidido no fechamento de 29/08. Recomendação da IA era esperar a
  evidência de uso da #86 (04/09); foi RECUSADA, com o motivo declarado por Wagner
  (a semana seguinte estará tomada). Divergência registrada — recusada.
  O que muda, e só isso: no celular, a tela "Visão" passa a ser a porta e carrega as três
  opções (WAM · Fábrica · Por resolver) como botões grandes; tocar em uma abre a lista.
  Antes, na Visão as abas ficavam escondidas junto com o resto. Desktop inalterado.
  Nenhuma mecânica, contagem, marcação ou formato de relato foi tocado.

  v15 (29/08/2026) — CORREÇÃO DE DEFEITO, apurada no primeiro uso do painel publicado.
  "Copiar relato do dia" não fazia nada. Causa: sobra da migração do v11. O relato ainda
  varria estado.itens supondo chaves por ÍNDICE (i0, i1); desde o v11 as chaves são IDs
  estáveis (#61, OP:...). +k.slice(1) devolvia número errado ou NaN, ITENS[i] vinha
  indefinido e o clique estourava em silêncio — a mesma família da "recusa silenciosa".
  Corrigido: a varredura passa a percorrer ITENS e ler o estado pelo ID estável.
  Formato do relato inalterado — o fechamento depende dele.
  Não fura o congelamento: defeito, não refinamento (régua de 17/08).

  v14 (29/08/2026) — VERSÃO DE PUBLICAÇÃO. Mudança de CONTEÚDO, não de especificação,
  autorizada pela decisão datada de 29/08 de publicar o painel em endereço público.
  NÃO fura o congelamento: entra pela porta da decisão, e está registrada como tal.
  O que saiu do arquivo, e só isso: as duas senhas do e-SAJ (#61), o número da conta
  bancária (#3) e a placa do veículo (#15). Trocados por referência ao caderno e ao
  mestre. Endereço público é lido por qualquer pessoa que tenha o link — credencial
  não vai junto. Nenhuma outra linha, mecânica ou marcação foi alterada; a chave de
  memória continua a mesma, então o estado migra normalmente.
  Arquivo único: é este que roda no chat E no endereço fixo. Não existe cópia paralela.

  PAINEL v20 — derivado do WAM_MESTRE_30-08-2026_v4 (quarto fechamento de domingo 30/08/2026).
  Mudança do v19 para o v20: SOMENTE CONTEUDO. Nenhuma alteracao visual, de layout ou de
  mecanica. Acrescentado o item INV-JUVERLAN (cobranca das 09h00 com fallback em 02/09) e
  atualizado o bloco de interface do Inventario. Base: v19 recuperado do repositorio.
  v10 = v9 + correções de fidelidade ao Mestre (#34, #62, #76 e #57), hero/estrela dinâmicos,
  progresso estável do Top 3, foco realmente 1 bloco = 1 tarefa com captura de nota,
  data local de São Paulo, storage próprio com migração, régua proporcional só no desktop,
  rodapé alinhado à execução no desktop e alvos de toque maiores no celular.
  v9 = v8 + (a) hero "se eu fizer só uma coisa hoje", (b) ranking ①②③ nas ativas,
  (c) selos de natureza + tempo·energia, (d) próxima ação visível em cada card,
  (e) detalhes recolhidos, (f) grupos "Depois/Sem data" recolhidos, (g) fila em 2
  colunas no desktop, (h) navegação inferior por telas no celular.
  A chave de memória permanece a do v7 — o formato do estado não mudou.
  v8 = v7 + correção de defeito de primeiro uso: o modo foco abria sozinho e cobria a página.
  v7 = v6 + camada responsiva: um único arquivo serve celular e desktop.
  Mudança de ESPECIFICAÇÃO (não de conteúdo): camada integral no topo
  (placar · âncora com contagem · mapa de frentes · régua proporcional · modo foco 45min).
  Toda a mecânica do v5 preservada: teto de 3, puxar/soltar, feito/conteúdo/não feito,
  triagem da aba "Por resolver", relato do dia (formato idêntico), memória com migração v6/v5→v7.
  A adoção deste formato é decisão a ratificar no fechamento (congelamento de 5 dias / #83).
-->
<style>
  :root{
    --bg:#ffffff; --ink:#16181d; --muted:#6b7280; --line:#e5e7eb;
    --red:#b42318; --redbg:#fdf3f2;
    --hoje:#c2410c; --hojebg:#fff3eb;
    --amber:#8a5a00; --amberbg:#fdf7e7;
    --cinza:#4b5563; --cinzabg:#f4f5f7;
    --green:#186a3b; --greenbg:#eefaf2;
    --chip:#1f2227;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px 96px;}

  .regua{position:sticky;top:0;z-index:20;background:var(--chip);
    display:flex;gap:8px;overflow-x:auto;padding:8px;margin:0 -14px 10px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .regua::-webkit-scrollbar{display:none;}
  .rb{flex:0 0 auto;color:#fff;font-size:12.5px;padding:5px 9px;border-radius:5px;
    background:#33373f;white-space:nowrap;}
  .rb b{font-weight:700;}
  .rb.hoje{background:var(--red);}
  .rb .d{opacity:.72;}

  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 0 8px;}
  header.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em;}
  header.top .sub{font-size:12px;color:var(--muted);}
  .reload{border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:15px;padding:4px 10px;cursor:pointer;}

  /* ===== camada integral ===== */
  .placar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 8px;}
  .pz{border:1px solid var(--line);border-radius:10px;padding:8px 6px 7px;text-align:center;}
  .pz .n{display:block;font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .pz .r{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-top:3px;}
  .pz.venc{background:var(--redbg);border-color:#f3d4d1;} .pz.venc .n{color:var(--red);}
  .pz.hoje{background:var(--hojebg);border-color:#f6dcc8;} .pz.hoje .n{color:var(--hoje);}
  .pz.sem7{background:var(--amberbg);border-color:#efe2b8;} .pz.sem7 .n{color:var(--amber);}
  .pz.trat{background:var(--greenbg);border-color:#cdeeda;} .pz.trat .n{color:var(--green);}

  .barra{height:7px;border-radius:6px;background:#eef0f3;overflow:hidden;margin:0 0 10px;}
  .barra i{display:block;height:100%;width:0;background:var(--green);border-radius:6px;
    transition:width .25s;}

  .ancora{display:block;background:var(--redbg);
    border:1px solid #f3d4d1;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .ancora .rotulo{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--red);font-weight:800;margin-bottom:5px;}
  .ancora .linhaA{display:flex;align-items:center;gap:10px;}
  .ancora .hx{font-size:12.5px;color:#4a4f57;margin-top:5px;line-height:1.45;}
  .ancora .hx b{color:var(--ink);}
  .ancora .estrela{font-size:18px;line-height:1;}
  .ancora .tx{flex:1;min-width:0;font-size:13.5px;}
  .ancora .tx b{display:block;font-size:14.5px;}
  .ancora .cd{color:var(--red);font-weight:800;}
  .ancora button{border:1px solid var(--red);color:var(--red);background:#fff;
    border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto;}

  details.integral{margin-bottom:12px;}
  details.integral>summary{list-style:none;cursor:pointer;font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 0;}
  details.integral>summary::-webkit-details-marker{display:none;}
  details.integral>summary::after{content:" ▾";}
  details.integral:not([open])>summary::after{content:" ▸ mostrar";}

  .mapa{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px;}
  .tile{appearance:none;border:1px solid var(--line);border-left-width:5px;border-radius:10px;
    background:#fff;padding:9px 10px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);}
  .tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .tile .tn{display:block;font-size:13px;font-weight:700;}
  .tile .td{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .tile .tx{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35;}
  .tile.venc{border-left-color:var(--red);background:var(--redbg);}
  .tile.hoje{border-left-color:var(--hoje);background:var(--hojebg);}
  .tile.sem7{border-left-color:var(--amber);background:var(--amberbg);}
  .tile.ok{border-left-color:#c9ccd2;}
  .tile.aberta{outline:2px solid var(--ink);outline-offset:1px;}
  .dot{display:inline-block;min-width:20px;text-align:center;font-size:11.5px;font-weight:800;
    border-radius:6px;padding:1px 5px;color:#fff;}
  .dot.venc{background:var(--red);} .dot.hoje{background:var(--hoje);}
  .dot.sem7{background:var(--amber);} .dot.resto{background:#9aa1ab;}
  .dot.ok{background:var(--green);}

  #drawer{margin-top:8px;}
  #drawer .dhead{font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 6px;}
  .mini{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--line);border-left-width:4px;border-radius:8px;
    padding:8px 10px;margin-bottom:6px;}
  .mini .txt{font-size:13px;min-width:0;}
  .mini .mp{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .mini .acoes{margin:0;flex:0 0 auto;}
  .u-venc{border-left-color:var(--red);}
  .u-hoje{border-left-color:var(--hoje);}
  .u-sem7{border-left-color:var(--amber);}
  .u-dep,.u-aberto{border-left-color:#c9ccd2;}

  .tempo{position:relative;height:78px;margin:12px 2px 2px;}
  .tempo .linha{position:absolute;left:0;right:0;top:50%;height:2px;background:#d7dade;border-radius:2px;}
  .tempo .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;
    border-radius:50%;background:#9aa1ab;border:2px solid #fff;box-shadow:0 0 0 1px #d7dade;}
  .tempo .mk.venc{background:var(--red);} .tempo .mk.hoje{background:var(--hoje);}
  .tempo .mk.sem7{background:var(--amber);}
  .tempo .lb{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted);
    white-space:nowrap;text-align:center;line-height:1.25;}
  .tempo .lb b{display:block;color:var(--ink);font-size:11px;}
  .tempo .lb.cima{bottom:calc(50% + 12px);} .tempo .lb.baixo{top:calc(50% + 12px);}
  .tempo .agulha{position:absolute;top:12px;bottom:12px;width:2px;background:var(--ink);}
  .tempo .agulha i{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--ink);}
  .tempo-depois{font-size:11px;color:var(--muted);text-align:right;margin:0 2px 4px;}

  nav.abas{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  nav.abas button{background:none;border:none;border-bottom:2px solid transparent;
    padding:8px 0;font-size:14px;color:var(--muted);cursor:pointer;font-weight:600;}
  nav.abas button.on{color:var(--ink);border-bottom-color:var(--ink);}

  .aviso{background:var(--redbg);border:1px solid #f3d4d1;color:var(--red);
    border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;}
  .aviso.neutro{background:#f6f7f8;border-color:var(--line);color:#3f434a;}
  .aviso.hide{display:none;}

  h2.sec{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin:18px 0 8px;}
  .gsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
    border-radius:6px;padding:5px 9px;margin:12px 0 7px;}
  .gsec.venc{background:var(--redbg);color:var(--red);}
  .gsec.hoje{background:var(--hojebg);color:var(--hoje);}
  .gsec.sem7{background:var(--amberbg);color:var(--amber);}
  .gsec.dep,.gsec.aberto{background:var(--cinzabg);color:var(--cinza);}

  .card{border:1px solid var(--line);border-left-width:5px;border-radius:10px;
    padding:12px;margin-bottom:10px;}
  .card.ativa{border-color:#c9ccd2;}
  .card.ativa.u-venc{border-left-color:var(--red);}
  .card.ativa.u-hoje{border-left-color:var(--hoje);}
  .card.resolvido{background:#fafafa;border-left-color:#c9ccd2;}
  .id{display:inline-block;background:#eef0f3;border-radius:5px;padding:1px 7px;
    font-size:12.5px;font-weight:700;margin-right:8px;}
  .tit{font-weight:700;font-size:15px;}
  .desc{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .prazo{font-size:13px;font-weight:700;margin-top:6px;}
  .prazo.vermelho{color:var(--red);}
  .prazo.ambar{color:var(--amber);}

  .acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  button.b{border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink);}
  button.b:hover{background:#f6f7f8;}
  button.b:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  button.b.on{background:var(--chip);color:#fff;border-color:var(--chip);}
  button.b.ghost{color:var(--muted);}

  textarea.nota,input.campo{width:100%;border:1px solid var(--line);border-radius:6px;
    padding:8px;font:inherit;font-size:13.5px;background:#fff;}
  textarea.nota{margin-top:9px;min-height:58px;resize:vertical;}
  .linha2{display:flex;gap:6px;margin-top:9px;}
  .linha2 input{flex:1;min-width:0;}

  /* v9: selos, próxima ação, ranking, detalhes */
  .selos{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .selo{font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:5px;
    padding:2px 7px;border:1px solid transparent;white-space:nowrap;}
  .selo.prazo{color:var(--red);background:var(--redbg);border-color:#f3d4d1;}
  .selo.destrava{color:#fff;background:var(--chip);}
  .selo.fin{color:var(--amber);background:var(--amberbg);border-color:#efe2b8;}
  .selo.dep{color:#1e5a8a;background:#eef4fb;border-color:#d3e2f2;}
  .selo.mon{color:var(--cinza);background:var(--cinzabg);border-color:#e2e4e8;}
  .selo.te{color:var(--muted);background:#fff;border-color:var(--line);
    font-weight:700;letter-spacing:0;}
  .pax{font-size:14px;font-weight:700;margin-top:6px;line-height:1.4;}
  .pax::before{content:"→ ";color:var(--muted);}

  .telanav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;

    .telanav button.acao{flex:0 0 auto;padding:10px 10px;color:var(--ink);}
    .rodape{display:none!important;}
    .wrap{padding-bottom:110px;}
    .tempo{display:none;}
    .tempo-depois{text-align:left;margin-top:8px;}

       botões grandes e abrem a lista correspondente. Uma tela por vez. */
    body.tela-visao .colOps > *:not(nav.abas){display:none;}
    body.tela-visao .colOps{margin-top:12px;}
    body.tela-visao nav.abas{display:flex;flex-direction:column;gap:8px;
      border-bottom:none;margin-bottom:0;}
    body.tela-visao nav.abas button{border:1px solid var(--line);border-radius:10px;
      background:#fff;padding:14px 12px;font-size:15px;font-weight:800;
      color:var(--ink);text-align:left;border-bottom:1px solid var(--line);}
    body.tela-visao nav.abas button.on{border-color:var(--chip);
      box-shadow:inset 3px 0 0 var(--chip);}
    body.tela-visao nav.abas button::after{content:" ›";float:right;color:var(--muted);}
    body.tela-exec .colInt{display:none;}
    body.tela-tri .colInt{display:none;}
    body.tela-tri nav.abas{display:none;}
    nav.abas [data-aba="porresolver"]{display:none;}

  @media (min-width:560px){ .mapa{grid-template-columns:1fr 1fr 1fr;} }

  /* v17: o desenho de duas colunas foi removido — era ele que aparecia espremido

  /* v13 → v17: o enxuto é o padrão em qualquer largura.

    .regua{display:none;}
    header.top .sub{display:none;}
    header.top h1{font-size:13.5px;}
    header.top{padding:2px 0 4px;}
    .wrap{padding-top:2px;}
    .placar{gap:4px;margin:0 0 6px;}
    .pz{padding:5px 4px 4px;}

    .pz .r{font-size:9.5px;}

    body.compacto .placar{gap:4px;}

    .telanav button.acao.mini{padding:10px 8px;font-size:13px;}
  /* dentro de tela cheia real, nada de margem desperdiçada */
  :fullscreen .wrap{padding-top:2px;}

/* ===== placar ===== */
function contagens(){
  const c = {venc:0,hoje:0,sem7:0,trat:0,ativas:0};
  ITENS.forEach((it,i)=>{
    const s = estado.itens[chave(i)].status;
    if(RESOLVIDO.includes(s)){ c.trat++; return; }
    if(s==='ativa') c.ativas++;
    const u = urgDe(it);
    if(u==='venc'||u==='hoje'||u==='sem7') c[u]++;
  });
  return c;
}
function placarRender(){
  const c = contagens();
  $('#placar').innerHTML =
    `<div class="pz venc"><span class="n">${c.venc}</span><span class="r">vencidas</span></div>`+
    `<div class="pz hoje"><span class="n">${c.hoje}</span><span class="r">hoje 10/09</span></div>`+
    `<div class="pz sem7"><span class="n">${c.sem7}</span><span class="r">em 7 dias</span></div>`+
    `<div class="pz trat"><span class="n">${c.trat}</span><span class="r">tratadas</span></div>`;
  const feitasTop = PRIORIDADE_BASE.filter(id=>{
    const i=ITENS.findIndex(it=>it.id===id);
    return i>=0 && RESOLVIDO.includes(estado.itens[chave(i)].status);
  }).length;
  $('#barraFill').style.width = Math.round(feitasTop/PRIORIDADE_BASE.length*100)+'%';
  $('#barraLabel').textContent = `Prioridades-base do dia: ${feitasTop}/${PRIORIDADE_BASE.length} tratadas`;
}

function heroIdxAtual(){
  return ITENS.findIndex((it,i)=>it.aba==='wam' && !RESOLVIDO.includes(estado.itens[chave(i)].status));
}
function heroRender(){
  const i=heroIdxAtual(), el=$('#ancora');
  if(i<0){ el.innerHTML='<div class="rotulo">Se eu fizer só uma coisa hoje</div><div class="hx"><b>Nenhuma pendência WAM aberta neste painel.</b></div>'; return; }
  const it=ITENS[i], m=metaDe(it), h=HERO_INFO[it.id]||{p:it.desc,d:'o próximo passo desta frente.'};
  el.innerHTML = `<div class="rotulo">Se eu fizer só uma coisa hoje</div>
    <div class="linhaA"><span class="estrela" aria-hidden="true">★</span>
      <span class="tx"><b>${it.id} · ${it.tit}</b><span class="cd" id="cd"></span></span>
      <button data-hero-focus="${i}">Focar 45′</button></div>
    <div class="hx"><b>Por quê:</b> ${h.p}</div>
    <div class="hx"><b>Destrava:</b> ${h.d}</div>
    <div class="hx"><b>Ação exata:</b> ${m.a||it.desc}</div>`;
  cdRender();
}
function cdRender(){
  const i=heroIdxAtual(); if(i<0 || !$('#cd')) return;
  const it=ITENS[i], el=$('#cd');
  if(it.id!=='#61'){ el.textContent=it.prazo; return; }
  const alvo = new Date('2026-08-31T23:59:59-03:00');
  const ms = alvo - new Date();
  if(ms < 0){ el.textContent = 'PRAZO ESTOURADO — tratar já'; return; }
  const d = Math.floor(ms/86400000);
  if(d < 1){
    const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
    el.textContent = 'vence HOJE — restam '+h+'h'+String(m).padStart(2,'0');
  } else el.textContent = 'faltam '+d+(d===1?' dia':' dias')+' — vence 31/08';
}

/* ===== mapa das frentes ===== */
const itensDaFrente = f => ITENS.map((it,i)=>({it,i}))
  .filter(o => f.ids.includes(o.it.id) || (f.aba && o.it.aba===f.aba))
  .map(o=>o.i);

function mapaRender(){
  $('#mapa').innerHTML = FRENTES.map(f=>{
    const c = {venc:0,hoje:0,sem7:0,resto:0};
    itensDaFrente(f).forEach(i=>{
      if(RESOLVIDO.includes(estado.itens[chave(i)].status)) return;
      const u = urgDe(ITENS[i]);
      c[(u==='dep'||u==='aberto')?'resto':u]++;
    });
    const pior = c.venc?'venc':(c.hoje?'hoje':(c.sem7?'sem7':'ok'));
    const dots = [['venc',c.venc],['hoje',c.hoje],['sem7',c.sem7],['resto',c.resto]]
      .filter(p=>p[1]).map(p=>`<span class="dot ${p[0]}">${p[1]}</span>`).join('')
      || '<span class="dot ok">✓</span>';
    return `<button class="tile ${pior} ${frenteAberta===f.k?'aberta':''}" data-frente="${f.k}">
      <span class="tn">${f.n}</span><span class="td">${dots}</span>
      ${f.extra?`<span class="tx">${f.extra}</span>`:''}</button>`;
  }).join('');
  drawerRender();
}
function drawerRender(){
  const el = $('#drawer');
  const f = FRENTES.find(x=>x.k===frenteAberta);
  if(!f){ el.hidden = true; el.innerHTML=''; return; }
  el.hidden = false;
  el.innerHTML = `<div class="dhead">${f.n} — itens da frente (toque de novo no bloco para fechar)</div>` +
    itensDaFrente(f).map(i=>{
      const it = ITENS[i], s = estado.itens[chave(i)].status;
      let acao;
      if(s==='fila') acao = `<button class="b" data-ac="puxar">Puxar</button>`;
      else if(s==='ativa') acao = `<span class="estado t">Ativa agora</span>`;
      else acao = `<span class="estado ${s==='feito'?'f':(s==='conteudo'?'c':'n')}">${ROTULO[s]}</span>`;
      return `<div class="mini u-${urgDe(it)}" data-i="${i}">
        <div class="txt"><span class="id">${it.id}</span><b>${it.tit}</b>
        <span class="mp">${it.prazo}</span></div>
        <div class="acoes">${acao}</div></div>`;
    }).join('');
}

/* ===== régua do tempo proporcional (29/08 → 30/09) ===== */
function tempoRender(){
  const ini = new Date('2026-09-08T00:00:00-03:00');
  const fim = new Date('2026-10-01T00:00:00-03:00');
  const pct = d => Math.min(99, Math.max(1,
    Math.round((new Date(d+'T12:00:00-03:00') - ini) / (fim - ini) * 100)));
  const marcos = [
    {d:'2026-09-10', lb:'10/09', tx:'#100 · #101 · Bruna 12h', u:'hoje', pos:'cima'},
    {d:'2026-09-12', lb:'12/09', tx:'#91 estratégica · #78', u:'sem7', pos:'baixo'},
    {d:'2026-09-15', lb:'15/09', tx:'#57 tributos · #98', u:'sem7', pos:'cima'},
    {d:'2026-09-30', lb:'30/09', tx:'regime · PGDAU', u:'sem7', pos:'baixo'}
  ];
  let html = '<div class="linha"></div>';
  marcos.forEach(m=>{
    const p = pct(m.d);
    html += `<span class="mk ${m.u}" style="left:${p}%"></span>
      <span class="lb ${m.pos}" style="left:${p}%"><b>${m.lb}</b>${m.tx}</span>`;
  });
  const agora = new Date();
  if(agora >= ini && agora <= fim){
    const pa = Math.min(99, Math.max(1, Math.round((agora - ini)/(fim - ini)*100)));
    html += `<span class="agulha" style="left:${pa}%"><i>VOCÊ</i></span>`;
  }
  $('#tempo').innerHTML = html;
}

function abasRender(){
  $('#abas').innerHTML = abasDef.map(a=>{
    let c = a.k==='porresolver'
      ? SEM_DATA.length + (nTriados() ? ' · '+nTriados()+' triados' : '')
      : ativasDe(a.k).length+'/'+TETO;
    return `<button data-aba="${a.k}" class="${estado.aba===a.k?'on':''}">${a.n} (${c})</button>`;
  }).join('');
}

function cardAtiva(o, r){
  const st = estado.itens[chave(o.i)], m = metaDe(o.it);
  return `<div class="card ativa u-${urgDe(o.it)}" data-i="${o.i}">
    <div><span class="rank">${o.i===heroIdxAtual()?'★ ':''}${RANK[r]||''}</span><span class="id">${o.it.id}</span><span class="tit">${o.it.tit}</span></div>
    ${m.a?`<div class="pax">${m.a}</div>`:''}
    ${selosHtml(m)}
    ${vinculoHtml(m)}
    <div class="prazo ${o.it.cor}">${o.it.prazo}</div>
    <details class="det"><summary>Detalhes</summary><div class="desc">${o.it.desc}</div></details>
    <div class="acoes"><button class="b ghost" data-ac="soltar">Soltar</button>
      <button class="b ghost" data-ac="focar">Focar 45′</button></div>
    <div class="acoes">
      <button class="b" data-ac="feito">Feito</button>
      <button class="b" data-ac="conteudo">Feito — tem conteúdo para o mestre</button>
      <button class="b" data-ac="naofeito">Não feito</button>
    </div>
    <textarea class="nota" data-nota placeholder="Nota opcional. O que o fechamento precisa saber.">${st.nota}</textarea>
  </div>`;
}
function cardResolvido(o){
  const st = estado.itens[chave(o.i)];
  const cls = st.status==='feito'?'f':(st.status==='conteudo'?'c':'n');
  const ph = st.status==='naofeito' ? 'Motivo. Esbarrou em terceiro? não foi feito?' : 'Conteúdo para o mestre.';
  return `<div class="card resolvido" data-i="${o.i}">
    <div><span class="id">${o.it.id}</span><span class="tit">${o.it.tit}</span></div>
    <div class="estado ${cls}">${ROTULO[st.status]}</div>
    <textarea class="nota" data-nota placeholder="${ph}">${st.nota}</textarea>
    <div class="acoes">
      <button class="b ghost" data-ac="reabrir">Reabrir</button>
      <button class="b ghost" data-ac="trocar">Trocar o estado</button>
    </div>
  </div>`;
}
function cardFila(o){
  const m = metaDe(o.it);
  return `<div class="card u-${urgDe(o.it)}" data-i="${o.i}">
    <div>${o.i===heroIdxAtual()?'<span class="rank">★</span>':''}<span class="id">${o.it.id}</span><span class="tit">${o.it.tit}</span></div>
    ${m.a?`<div class="pax">${m.a}</div>`:''}
    ${selosHtml(m)}
    ${vinculoHtml(m)}
    <div class="prazo ${o.it.cor}">${o.it.prazo}</div>
    <details class="det"><summary>Detalhes</summary><div class="desc">${o.it.desc}</div></details>
    <div class="acoes"><button class="b" data-ac="puxar">Puxar para hoje</button></div>
  </div>`;
}

/* ---- caixa de triagem (opção c, decidida em 28/08) ---- */
function blocoTriagem(s, t){
  if(!t) return '';
  if(t.tipo==='data'){
    return `<div class="estado t">Proposta de data — vai ao relato, não ao mestre</div>
      <div class="linha2">
        <input class="campo" type="date" data-tri="data" value="${t.data||''}" aria-label="Data proposta">
        <input class="campo" type="text" data-tri="quem" value="${t.quem||''}" placeholder="Quem">
      </div>
      <textarea class="nota" data-tri="nota" placeholder="O que destrava. Opcional.">${t.nota||''}</textarea>
      <div class="acoes"><button class="b ghost" data-ac="tri-limpar">Desfazer</button></div>`;
  }
  return `<div class="estado t">Proposta de encerramento — o fechamento decide</div>
    <div class="linha2">
      <input class="campo" type="date" data-tri="data" value="${t.data||''}" aria-label="Quando foi resolvido">
    </div>
    <textarea class="nota" data-tri="nota" placeholder="Fonte: o que aconteceu e onde está a prova. Sem isso não encerra.">${t.nota||''}</textarea>
    <div class="acoes"><button class="b ghost" data-ac="tri-limpar">Desfazer</button></div>`;
}
function cardPorResolver(p, s){
  const t = estado.triagem[s];
  return `<div class="pr ${t?'marcado':''}" data-s="${s}">
    <div class="txt"><span class="id">${p[0]}</span>${p[1]}</div>
    <div class="acoes">
      <button class="b ${t&&t.tipo==='data'?'on':''}" data-ac="tri-data">Dar data</button>
      <button class="b ${t&&t.tipo==='resolvido'?'on':''}" data-ac="tri-resolvido">Já está resolvido</button>
    </div>
    ${blocoTriagem(s,t)}
  </div>`;
}

function conteudoRender(){
  abasRender();
  const aba = estado.aba, cont = $('#conteudo'), av = $('#aviso');
  $('#blocoLivre').style.display = aba==='porresolver' ? 'none' : 'block';

  if(aba==='porresolver'){
    av.className = 'aviso neutro';
    av.textContent = 'Caixa de triagem. Os dois botões escrevem no relato do dia e não tocam no mestre — nada aqui vira ativa e nada sai da tabela sem decisão datada no fechamento.';
    cont.innerHTML = '<h2 class="sec">Sem data — '+SEM_DATA.length+' itens</h2>' +
      SEM_DATA.map((p,s)=>cardPorResolver(p,'s'+s)).join('');
    return;
  }

  const ativas = ativasDe(aba), resolvidos = resolvidosDe(aba), fila = filaDe(aba);
  if(ativas.length >= TETO){
    av.className='aviso';
    av.textContent = 'Teto de '+TETO+' atingido. Resolva uma e a vaga abre sozinha — a nota fica guardada em Resolvidos hoje até você copiar o relato.';
  } else { av.className='aviso hide'; }

  let html = `<h2 class="sec">Ativas de hoje — ${ativas.length} de ${TETO}</h2>`;
  html += ativas.length ? ativas.map((o,r)=>cardAtiva(o,r)).join('')
    : `<div class="leitura">Nenhuma ativa. Puxe da fila abaixo — no máximo ${TETO}.</div>`;
  if(resolvidos.length){
    html += `<h2 class="sec">Resolvidos hoje — ${resolvidos.length}</h2>` + resolvidos.map(cardResolvido).join('');
  }
  html += `<h2 class="sec">Fila — ${fila.length}, da mais urgente para a menos</h2><div class="fila">`;
  if(fila.length){
    URG_ORDEM.forEach(u=>{
      const g = fila.filter(o=>urgDe(o.it)===u);
      if(!g.length) return;
      const cab = `<div class="gsec ${u}">${URG_ROTULO[u]} — ${g.length}</div>`;
      const corpo = g.map(cardFila).join('');
      if(u==='dep' || u==='aberto'){
        html += `<details class="grupo"><summary>${cab}</summary><div class="gcards">${corpo}</div></details>`;
      } else { html += cab + corpo; }
    });
  } else { html += '<div class="leitura">Fila vazia nesta aba.</div>'; }
  html += `</div>`;
  cont.innerHTML = html;
}

function render(){
  placarRender();
  heroRender();
  mapaRender();
  conteudoRender();
  if(!$('#foco').hidden) focoRender();
}

let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600);
}
const hoje = () => {
  const parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const v = Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
  return `${v.year}-${v.month}-${v.day}`;
};

document.addEventListener('click', e=>{
  const abaBtn = e.target.closest('[data-aba]');
  if(abaBtn){
    estado.aba = abaBtn.dataset.aba; salvar(); render();
    /* v16: a partir da Visão, escolher uma aba abre a lista dela. */
    if(tela==='visao'){
      tela = (estado.aba==='porresolver') ? 'tri' : 'exec';
      telaAplicar(); window.scrollTo(0,0);
    }
    return;
  }

  const tile = e.target.closest('[data-frente]');
  if(tile){
    frenteAberta = (frenteAberta===tile.dataset.frente) ? null : tile.dataset.frente;
    mapaRender(); return;
  }

  const heroBtn = e.target.closest('[data-hero-focus]');
  if(heroBtn){
    const i=+heroBtn.dataset.heroFocus, st=estado.itens[chave(i)];
    if(st.status==='fila'){
      if(ativasDe(ITENS[i].aba).length>=TETO){ toast('A prioridade está fora das 3 ativas. Solte ou resolva uma ativa antes de focá-la.'); return; }
      st.status='ativa'; salvar(); render();
    }
    focoAbrir(i); return;
  }

  const b = e.target.closest('[data-ac]');
  if(!b) return;
  const ac = b.dataset.ac;

  const pr = b.closest('[data-s]');
  if(pr){
    const s = pr.dataset.s;
    if(ac==='tri-data'){
      estado.triagem[s] = {tipo:'data', data:'', quem:'Wagner', nota:''};
      toast('Vai ao relato como proposta de data. O fechamento escreve no mestre.');
    } else if(ac==='tri-resolvido'){
      estado.triagem[s] = {tipo:'resolvido', data:hoje(), nota:''};
      toast('Proposta de encerramento. Escreva a fonte — sem fonte não encerra.');
    } else if(ac==='tri-limpar'){
      delete estado.triagem[s];
    }
    salvar(); render(); return;
  }

  const card = b.closest('[data-i]');
  if(!card) return;
  const i = +card.dataset.i, st = estado.itens[chave(i)];
  if(ac==='puxar'){
    if(ativasDe(ITENS[i].aba).length >= TETO){ toast('Teto de '+TETO+'. Resolva uma antes de puxar esta.'); return; }
    st.status='ativa';
  } else if(ac==='soltar'){
    if(st.nota.trim() && !confirm('Soltar apaga a nota que você digitou. Se ela tem conteúdo, use "Feito — tem conteúdo para o mestre". Soltar mesmo assim?')) return;
    st.status='fila'; st.nota='';
  } else if(ac==='focar'){
    focoAbrir(i); return;
  } else if(RESOLVIDO.includes(ac)){
    st.status=ac; toast('Resolvido. Vaga livre — a nota fica guardada.');
  } else if(ac==='reabrir'){
    if(ativasDe(ITENS[i].aba).length >= TETO){ toast('Teto de '+TETO+'. Resolva uma ativa antes de reabrir esta.'); return; }
    st.status='ativa';
  } else if(ac==='trocar'){
    const ordem=['feito','conteudo','naofeito'];
    st.status = ordem[(ordem.indexOf(st.status)+1)%3];
  }
  salvar(); render();
});

document.addEventListener('input', e=>{
  if(e.target.id==='livre'){ estado.livre=e.target.value; salvar(); return; }
  const tri = e.target.closest('[data-tri]');
  if(tri){
    const s = tri.closest('[data-s]').dataset.s;
    if(estado.triagem[s]){ estado.triagem[s][tri.dataset.tri] = tri.value; salvar(); }
    return;
  }
  if(e.target.matches('[data-nota]')){
    const i=+e.target.closest('[data-i]').dataset.i;
    estado.itens[chave(i)].nota = e.target.value; salvar();
  }
});

/* ===== modo foco — 45 minutos, uma ativa ===== */
let focoIdx = null, focoRestam = 45*60, focoInt = null;
const focoFmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function focoAbrir(idx){
  if(idx==null){
    const ativas = ativasDe(estado.aba==='porresolver' ? 'wam' : estado.aba);
    if(!ativas.length){ toast('Nenhuma ativa. Puxe uma da fila antes do bloco.'); return; }
    idx = ativas[0].i;
  }
  focoParar();
  focoRestam = 45*60;
  focoIdx = idx;
  $('#foco').classList.remove('fim');
  $('#foco').hidden = false;
  document.body.style.overflow = 'hidden';
  focoRender();
}
function focoFechar(){
  focoParar();
  $('#foco').hidden = true;
  document.body.style.overflow = '';
  document.title = TITULO;
}
function focoParar(){ clearInterval(focoInt); focoInt = null; $('#focoIniciar').textContent='Iniciar'; }
function focoTic(){
  focoRestam = Math.max(0, focoRestam-1);
  $('#focoTempo').textContent = focoFmt(focoRestam);
  document.title = '⏱ '+focoFmt(focoRestam);
  if(focoRestam===0){
    focoParar();
    $('#foco').classList.add('fim');
    if(navigator.vibrate) navigator.vibrate([220,120,220]);
    document.title = '⏰ Bloco encerrado';
    toast('Bloco de 45 encerrado. Pausa — interrupção entra ENTRE blocos.');
  }
}
function focoRender(){
  $('#focoTempo').textContent = focoFmt(focoRestam);
  const corpo = $('#focoCorpo'), acoes = $('#focoAcoes');
  if(focoIdx==null || estado.itens[chave(focoIdx)].status!=='ativa'){
    const ativas = ativasDe(estado.aba==='porresolver' ? 'wam' : estado.aba);
    if(ativas.length){ focoIdx = ativas[0].i; }
    else {
      corpo.innerHTML = '<div class="fnada">Nenhuma ativa nesta aba. Saia, puxe uma da fila e volte — ou encerre o bloco aqui.</div>';
      acoes.innerHTML = '';
      return;
    }
  }
  const it = ITENS[focoIdx];
  const m = metaDe(it);
  corpo.innerHTML = `<div class="fid"><span class="id">${it.id}</span></div>
    <div class="ftit">${it.tit}</div>
    ${m.a?`<div class="fprox">${m.a}</div>`:''}
    <div class="fdesc">${it.desc}</div>
    <div class="fprazo ${it.cor}">${it.prazo}</div>`;
  acoes.innerHTML = `
    <button class="b" data-focoac="feito">Feito</button>
    <button class="b" data-focoac="conteudo">Feito — tem conteúdo</button>
    <button class="b" data-focoac="naofeito">Não feito</button>`;
}
$('#abrirFoco').addEventListener('click', ()=>focoAbrir(null));

/* ===== v9: telas no celular (Visão · Executar · Triagem) ===== */
let tela = 'visao';
function telaAplicar(){
  document.body.classList.remove('tela-visao','tela-exec','tela-tri');
  document.body.classList.add('tela-'+tela);
  document.querySelectorAll('.telanav [data-tela]').forEach(b=>
    b.classList.toggle('on', b.dataset.tela===tela));
}
document.querySelectorAll('.telanav [data-tela]').forEach(b=>
  b.addEventListener('click', ()=>{
    tela = b.dataset.tela;

/* ===== v12: altura de tela no celular =====
   ⤢ tenta a tela cheia real do aparelho; onde o app não permite, liga o modo
   compacto, que recolhe régua, subtítulo e folgas — sobra tela para a tarefa. */
function compactoLigar(on){                     /* on = enxuto (padrão no celular) */
  document.body.classList.toggle('largo', !on);
  $('#tnTela').textContent = on ? '⤢' : '⤡';
}
$('#tnTela').addEventListener('click', async ()=>{
  const el = document.documentElement;
  if(document.fullscreenElement){
    try{ await document.exitFullscreen(); }catch(err){}
    compactoLigar(false); return;
  }
  let cheia = false;
  try{
    if(el.requestFullscreen){ await el.requestFullscreen(); cheia = true; }
    else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); cheia = true; }
  }catch(err){}
  compactoLigar(true);
  toast(cheia ? 'Tela cheia. Toque de novo para sair.'
              : 'O app do Claude não solta a tela cheia. Para a tela inteira: ⋮ → baixar, e abrir o arquivo no Chrome.');
});
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement) compactoLigar(false); });

/* ---- relato do dia (formato idêntico ao v5 — o fechamento depende dele) ---- */
const br = d => d ? d.split('-').reverse().join('/') : 'sem data';
$('#copiar').addEventListener('click', ()=>{
  const L=[], nome = i => ITENS[i].id + ' ' + ITENS[i].tit;
  const grupo = (titulo, filtro, comNota) => {
    const arr = ITENS.map((it,i)=>i).filter(i=>{ const st=estado.itens[chave(i)]; return st && filtro(st); });
    if(!arr.length) return;
    L.push(titulo);
    arr.forEach(i=>{ const n=estado.itens[chave(i)].nota.trim();
      L.push('- '+nome(i)+(comNota&&n?'\n  '+n:'')); });
    L.push('');
  };
  L.push('RELATO DO DIA — 10/09/2026'); L.push('');
  grupo('FEITO', s=>s.status==='feito', false);
  grupo('FEITO — TEM CONTEÚDO PARA O MESTRE', s=>s.status==='conteudo', true);
  grupo('NÃO FEITO — COM MOTIVO', s=>s.status==='naofeito', true);

  const abertas = ITENS.map((it,i)=>i).filter(i=>{ const st=estado.itens[chave(i)]; return st && st.status==='ativa'; });
  if(abertas.length){ L.push('AINDA ABERTAS AO FIM DO DIA'); abertas.forEach(i=>L.push('- '+nome(i))); L.push(''); }

  const tData = Object.keys(estado.triagem).filter(s=>estado.triagem[s].tipo==='data');
  if(tData.length){
    L.push('TRIAGEM — PROPOSTA DE DATA (o fechamento decide)');
    tData.forEach(s=>{ const t=estado.triagem[s], p=SEM_DATA[+s.slice(1)];
      L.push('- '+p[0]+' '+p[1]+'\n  data proposta '+br(t.data)+' · '+(t.quem||'sem responsável')+(t.nota?' · '+t.nota:'')); });
    L.push('');
  }
  const tRes = Object.keys(estado.triagem).filter(s=>estado.triagem[s].tipo==='resolvido');
  if(tRes.length){
    L.push('TRIAGEM — PROPOSTA DE ENCERRAMENTO (já resolvido)');
    tRes.forEach(s=>{ const t=estado.triagem[s], p=SEM_DATA[+s.slice(1)];
      L.push('- '+p[0]+' '+p[1]+'\n  resolvido em '+br(t.data)+' · fonte: '+(t.nota.trim()||'A INFORMAR — sem fonte não encerra')); });
    L.push('');
  }
  L.push('NOVO / OBSERVAÇÕES');
  L.push(estado.livre.trim() || '- nada');

  const txt = L.join('\n');
  const ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Relato copiado. Cole no chat de fechamento.'); }
  catch(err){ toast('Não copiou — tente de novo ou use o ↻.'); }
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(()=>{}); }
});

/* ---- persistência v10, com migração das chaves anteriores ---- */
/* v12: duas vias de gravação. window.storage existe dentro do app do Claude;
   quando o arquivo é aberto direto no navegador (ou quando o storage falha, como
   falhou no celular em 29/08), cai para o armazenamento do próprio navegador.
   Se as duas falharem, o painel avisa em vez de fingir que gravou. */
let VIA = null;               /* 'app' · 'navegador' · 'nenhuma' */
let ultimaGrav = null;

async function viaSet(k,v){
  if(window.storage && window.storage.set){
    try{ await window.storage.set(k,v); VIA='app'; return true; }catch(err){}
  }
  try{ localStorage.setItem(k,v); VIA='navegador'; return true; }catch(err){}
  VIA='nenhuma'; return false;
}
async function viaGet(k){
  if(window.storage && window.storage.get){
    try{ const r = await window.storage.get(k); if(r&&r.value) return r.value; }catch(err){}
  }
  try{ const v = localStorage.getItem(k); if(v) return v; }catch(err){}
  return null;
}
function gravStatus(){
  const el = $('#gravAviso');
  if(VIA==='nenhuma'){
    el.className='gravaviso on ruim';
    el.textContent='Não está sendo possível gravar neste aparelho. As marcações somem se você fechar — copie o relato do dia antes de sair.';
  } else if(VIA==='navegador'){
    el.className='gravaviso on';
    el.textContent='Gravando no navegador deste aparelho — não sincroniza com o desktop. (toque para ocultar)';
  } else { el.className='gravaviso'; el.textContent=''; }
  const h = $('#gravHora');
  if(h) h.textContent = ultimaGrav ? 'gravado às '+ultimaGrav : '';
}

let salvarT;
function salvar(){
  clearTimeout(salvarT);
  salvarT = setTimeout(async ()=>{
    const ok = await viaSet(CHAVE, JSON.stringify(estado));
    if(ok) ultimaGrav = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    gravStatus();
  }, 700);
}
function aplicar(g){
  if(!g || !g.itens) return false;
  let itens = g.itens;
  if(Object.keys(itens).some(k=>/^i\d+$/.test(k))){          /* estado antigo, por índice */
    const conv = {};
    Object.keys(itens).forEach(k=>{
      const n = +k.slice(1), alvo = ORDEM_LEGADA[n];
      if(alvo) conv[alvo] = itens[k];
    });
    itens = conv;
  }
  Object.keys(estado.itens).forEach(k=>{ if(itens[k]) estado.itens[k]=itens[k]; });
  estado.triagem = g.triagem || {};
  estado.livre = g.livre || '';
  estado.aba = g.aba || 'wam';
  return true;
}
async function carregar(){
  let ok=false;
  try{ const v = await viaGet(CHAVE); if(v) ok = aplicar(JSON.parse(v)); }catch(err){}
  if(!ok){
    for(const ch of CHAVES_ANTERIORES){
      try{ const v2 = await viaGet(ch);
        if(v2 && aplicar(JSON.parse(v2))){ toast('Marcações anteriores recuperadas.'); salvar(); break; }
      }catch(err){}
    }
  }
  if(!ok && VIA===null){ await viaSet(CHAVE, JSON.stringify(estado)); }
  gravStatus();
  $('#livre').value = estado.livre;
  render();
}
$('#reload').addEventListener('click', async ()=>{ await carregar(); toast('Estado recarregado.'); });

/* ===== v21: busca por termo em todo o painel =====
   Varre item por item (titulo, detalhe, prazo, proximo passo, selo, vinculo,
   por que/destrava e a NOTA do dia), a lista "Por resolver", as frentes do mapa,
   a regua de datas e a nota livre. Acento e maiuscula nao contam. Clicar no
   resultado abre a aba certa e rola ate o item. Nada aqui grava nada. */
function bNorm(t){
  t = (t==null) ? '' : String(t);
  let o = '';
  for(let i=0;i<t.length;i++){
    const c = t[i];
    let d = c.normalize('NFD')[0] || c;
    d = d.toLowerCase();
    o += (d.length===1) ? d : c.toLowerCase()[0] || c;
  }
  return o;
}
function bEsc(t){
  return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function bTrecho(txt, termos, max){
  max = max || 160;
  txt = String(txt==null?'':txt);
  const n = bNorm(txt), faixas = [];
  termos.forEach(t=>{
    let i = n.indexOf(t);
    while(i >= 0){ faixas.push([i, i+t.length]); i = n.indexOf(t, i+t.length); }
  });
  if(!faixas.length){
    return bEsc(txt.slice(0,max)) + (txt.length>max ? '\u2026' : '');
  }
  faixas.sort((a,b)=>a[0]-b[0]);
  const ini = Math.max(0, faixas[0][0]-55);
  const fim = Math.min(txt.length, ini+max);
  let out = ini>0 ? '\u2026' : '', p = ini;
  faixas.forEach(f=>{
    if(f[1] <= p || f[0] >= fim) return;
    const a = Math.max(f[0], p), b = Math.min(f[1], fim);
    if(a > p) out += bEsc(txt.slice(p, a));
    out += '<mark>' + bEsc(txt.slice(a, b)) + '</mark>';
    p = b;
  });
  if(p < fim) out += bEsc(txt.slice(p, fim));
  if(fim < txt.length) out += '\u2026';
  return out;
}
function bIndice(){
  const ix = [];
  ITENS.forEach((it,i)=>{
    const m = metaDe(it), h = HERO_INFO[it.id] || {}, st = estado.itens[chave(i)] || {};
    const f = FRENTES.find(x => x.ids.includes(it.id) || (x.aba && x.aba===it.aba));
    const campos = [
      ['Detalhe', it.desc], ['Prazo', it.prazo], ['Pr\u00f3ximo passo', m.a],
      ['Selo', m.s], ['V\u00ednculo', m.v], ['Por qu\u00ea', h.p], ['Destrava', h.d],
      ['Nota do dia', st.nota]
    ].filter(c => c[1] && String(c[1]).trim());
    ix.push({tipo:'item', i:i,
      onde:(it.aba==='wam' ? 'WAM' : 'F\u00e1brica') + (f ? ' \u00b7 ' + f.n : ''),
      titulo: it.id + ' \u00b7 ' + it.tit, campos:campos,
      texto: it.id + ' ' + it.tit + ' ' + campos.map(c=>c[1]).join(' ')});
  });
  SEM_DATA.forEach((p,s)=>{
    const t = estado.triagem['s'+s], extra = t ? [t.data,t.quem,t.nota].filter(Boolean).join(' ') : '';
    ix.push({tipo:'semdata', s:'s'+s, onde:'Por resolver \u00b7 sem data',
      titulo: p[0] + ' \u00b7 ' + p[1], campos: extra ? [['Triagem', extra]] : [],
      texto: p[0] + ' ' + p[1] + ' ' + extra});
  });
  FRENTES.forEach(f=>{
    ix.push({tipo:'frente', k:f.k, onde:'Mapa das frentes', titulo:f.n,
      campos: f.extra ? [['Interface', f.extra]] : [],
      texto: f.n + ' ' + (f.extra||'')});
  });
  REGUA.forEach(r=>{
    ix.push({tipo:'regua', onde:'R\u00e9gua do tempo', titulo: r.d + (r.t ? ' \u2014 ' + r.t : ''),
      campos:[['Marco', r.x]], texto: r.d + ' ' + r.t + ' ' + r.x});
  });
  if((estado.livre||'').trim()){
    ix.push({tipo:'livre', onde:'Nota do dia', titulo:'Novo / observa\u00e7\u00f5es do dia',
      campos:[['Escrito hoje', estado.livre]], texto: estado.livre});
  }
  return ix;
}
let bAtual = [];
function bRender(){
  const q = $('#buscaCampo').value.trim();
  const cx = $('#bres');
  $('#buscaLimpar').hidden = !q;
  if(q.length < 2){ cx.hidden = true; cx.innerHTML = ''; bAtual = []; return; }
  const termos = bNorm(q).split(/\s+/).filter(Boolean);
  bAtual = bIndice().filter(r=>{
    const n = bNorm(r.texto);
    return termos.every(t => n.indexOf(t) >= 0);
  });
  cx.hidden = false;
  if(!bAtual.length){
    cx.innerHTML = '<div class="bnada">Nada com <b>' + bEsc(q) +
      '</b> neste painel. O painel \u00e9 a foto do dia \u2014 o hist\u00f3rico est\u00e1 no mestre e no arquivo.</div>';
    return;
  }
  const lim = bAtual.slice(0, 40);
  let html = '<div class="bcab">' + bAtual.length + (bAtual.length===1 ? ' resultado' : ' resultados') +
    (bAtual.length > 40 ? ' \u2014 mostrando os 40 primeiros' : '') + '</div>';
  html += lim.map((r,k)=>{
    const linhas = r.campos.filter(c => bNorm(c[1]).indexOf(termos[0]) >= 0);
    const usar = (linhas.length ? linhas : r.campos).slice(0,2);
    return '<button class="br" data-bk="' + k + '">' +
      '<span class="bonde">' + bEsc(r.onde) + '</span>' +
      '<div class="btit">' + bTrecho(r.titulo, termos, 120) + '</div>' +
      usar.map(c => '<div class="bcampo"><b>' + bEsc(c[0]) + ':</b> ' + bTrecho(c[1], termos) + '</div>').join('') +
      '</button>';
  }).join('');
  cx.innerHTML = html;
}
function bDestacar(el){
  if(!el) return;
  const g = el.closest('details.grupo'); if(g) g.open = true;
  const d = el.querySelector('details.det'); if(d) d.open = true;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('achado');
  setTimeout(()=>el.classList.remove('achado'), 2600);
}
function bIr(r){
  $('#bres').hidden = true;
  if(r.tipo === 'item'){
    const it = ITENS[r.i];
    if(estado.aba !== it.aba){ estado.aba = it.aba; salvar(); }
    tela = 'exec'; telaAplicar(); render();
    requestAnimationFrame(()=>bDestacar(document.querySelector('#conteudo [data-i="' + r.i + '"]')));
  } else if(r.tipo === 'semdata'){
    if(estado.aba !== 'porresolver'){ estado.aba = 'porresolver'; salvar(); }
    tela = 'tri'; telaAplicar(); render();
    requestAnimationFrame(()=>bDestacar(document.querySelector('#conteudo [data-s="' + r.s + '"]')));
  } else if(r.tipo === 'frente'){
    tela = 'visao'; telaAplicar();
    const dt = document.querySelector('details.integral'); if(dt) dt.open = true;
    frenteAberta = r.k; mapaRender();
    requestAnimationFrame(()=>bDestacar(document.querySelector('[data-frente="' + r.k + '"]')));
  } else if(r.tipo === 'livre'){
    tela = 'exec'; telaAplicar(); render();
    requestAnimationFrame(()=>{ const el = $('#livre'); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } });
  } else {
    tela = 'visao'; telaAplicar(); window.scrollTo(0,0);
    document.body.classList.add('largo'); $('#tnTela').textContent = '\u21e1';
  }
}
let bT;
$('#buscaCampo').addEventListener('input', ()=>{ clearTimeout(bT); bT = setTimeout(bRender, 120); });
$('#buscaCampo').addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ $('#buscaCampo').value = ''; bRender(); $('#buscaCampo').blur(); }
  if(e.key === 'Enter' && bAtual.length){ e.preventDefault(); $('#buscaCampo').blur(); bIr(bAtual[0]); }
});
$('#buscaLimpar').addEventListener('click', ()=>{ $('#buscaCampo').value = ''; bRender(); $('#buscaCampo').focus(); });
$('#bres').addEventListener('click', e=>{
  const b = e.target.closest('[data-bk]');
  if(b) bIr(bAtual[+b.dataset.bk]);
});
